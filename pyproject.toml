[project]
name = "torch-dftd"
dynamic = ["version", "description", "readme", "dependencies", "optional-dependencies"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", extra = "gpu" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
